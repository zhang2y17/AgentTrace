[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "LLM Agent 可观测性、回放、离线评测与质量门禁平台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zy" }]
keywords = ["llm", "agent", "observability", "evaluation", "langgraph", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# 运行依赖
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "langgraph>=0.2,<0.4",
    "httpx>=0.27,<1",
    "python-ulid>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/zhang2y17/AgentTrace"
Documentation = "https://github.com/zhang2y17/AgentTrace/tree/main/docs"
Issues = "https://github.com/zhang2y17/AgentTrace/issues"

[project.optional-dependencies]
# 开发与测试依赖。默认测试路径不需要任何 API Key 与网络。
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "fakeredis>=2.23,<3",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认不跑 integration：它需要真实 PostgreSQL / Redis。
# 用 addopts 里的 -m "not integration" 实现"默认跳过"，比 skipif 更早生效——
# 避免在收集阶段就去连接数据库（连接超时会让整个测试套件卡住）。
addopts = "-q --strict-markers --strict-config -m 'not integration'"
# 把临时目录放在项目内，避免某些环境下清理系统临时目录受限
tmp_path_retention_count = 0
markers = [
    "unit: 纯逻辑测试，无 IO，无网络",
    "api: FastAPI 接口测试（TestClient + SQLite）",
    "smoke: 端到端冒烟测试（进程内完整生命周期）",
    "integration: 需要真实 PostgreSQL / Redis 或真实 LLM，默认跳过",
    "test_double: 明确使用测试替身（Fake LLM / fakeredis）",
    "real_llm: 真实 LLM 调用，需 LLM_API_KEY 且 ENABLE_REAL_LLM_TESTS=true",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # 行长由 formatter 控制，文档字符串中的中文表格容易超长
    "B008",  # FastAPI 的 Depends() 在默认参数中是标准用法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 测试中使用 assert 是预期的

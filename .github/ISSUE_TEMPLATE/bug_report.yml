name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交密钥、真实用户数据、生产日志或未公开业务信息。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及你预期发生什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用配置……
        2. 执行命令……
        3. 观察到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      options:
        - fake
        - openai
        - ollama
        - 不相关
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、数据库及启动方式。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或错误
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除密钥、个人数据、生产数据和内部地址。
          required: true
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true

name: 功能建议
description: 描述使用场景与期望行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你想完成什么，目前哪里受阻？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 描述可观察的输入、输出和边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的方案
      description: 可选。说明当前绕行方案或取舍。
  - type: checkboxes
    id: scope
    attributes:
      label: 数据边界
      options:
        - label: 示例可以使用公开或合成数据，不需要公司代码、真实用户数据或内部接口。
          required: true
